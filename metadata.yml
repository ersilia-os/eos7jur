Identifier: eos7jur
Slug: retromol-fingerprint
Status: In progress
Title: RetroMol Biosynthetic Fingerprint
Description: Decomposes a natural product into the biosynthetic building blocks 
  its assembly line would have used, returning a 452-dimensional count vector 
  over monomer tokens spanning polyketide extender units, amino acids and 
  tailoring modifications. RetroMol was built to give natural products and their
  biosynthetic gene clusters a shared encoding, and applies curated 
  retrobiosynthetic rules rather than a trained model, so output is fully 
  deterministic. A coverage value reports how much of the molecule was parsed; 
  compounds outside modular polyketide and nonribosomal peptide chemistry parse 
  poorly.
